name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # GD 2.2081 is what Geode v5.11.2 targets. The SDK version comes from
      # mod.json ("geode": "5.11.2"). The bindings are pinned to the last commit
      # before the 2.2091 update, because bindings main no longer matches v5.x.
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: 7407717c307d1cd94461786210b330ab868f4260
          combine: true

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
