name: Build Geode Mod

on:
  workflow_dispatch:
  push:
    branches:
      - "**"

jobs:
  build:
    name: Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7

      # GD 2.2081 is what Geode v5.11.2 targets. The SDK version comes from
      # mod.json ("geode": "5.11.2"). The bindings are pinned to the commit that
      # was current when v5.11.2 was released (2026-10-16), because bindings main
      # has moved on to GD 2.2091 and no longer matches the v5.x SDK.
      - name: Build the mod
        uses: geode-sdk/build-geode-mod@main
        with:
          bindings: geode-sdk/bindings
          bindings-ref: 1605f500d053f8de122bf5c7dc6d17c24866e02e
          combine: true

  package:
    name: Package builds
    runs-on: ubuntu-latest
    needs: ["build"]
    steps:
      - uses: geode-sdk/build-geode-mod/combine@main
        id: build

      - uses: actions/upload-artifact@v7
        with:
          name: Build Output
          path: ${{ steps.build.outputs.build-output }}
